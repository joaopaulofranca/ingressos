services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    command: sh -c "composer install --no-interaction --prefer-dist && exec php-fpm -F"

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
